<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stage Base • Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f8;color:#19171c;font:15px system-ui,sans-serif}header,main,nav{max-width:850px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 8px}h1{font-size:28px;letter-spacing:-1px;margin:10px 0}h2{font-size:19px}small{color:#666}main{padding:10px 18px 110px}button,input,select{font:inherit}button{border:0;border-radius:13px;padding:12px;cursor:pointer;background:#eeeaf2;color:#27113f;font-weight:650}button.primary{background:#ffd600;color:#171717}button.purple{background:#3a0888;color:white}input,select{width:100%;padding:12px;border:1px solid #dedbe3;border-radius:12px;background:white;margin:5px 0}label{display:block;margin-top:9px}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd;z-index:5}nav button{background:none;font-size:12px;padding:8px 5px}nav b{display:block;font-size:22px}nav .scan{background:#ffd600;border-radius:50%;width:49px;height:49px;font-size:23px}.hero{background:linear-gradient(120deg,#260650,#5410a1);color:white;padding:24px;border-radius:22px;margin:14px 0}.hero small{color:#e4d8ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border-radius:17px;padding:15px;box-shadow:0 2px 8px #25103b09}.metric strong{display:block;font-size:29px}.photo{height:145px;background:#e9e1f4;display:grid;place-items:center;font-size:55px;border-radius:12px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.asset{cursor:pointer}.asset h3{font-size:16px;margin:10px 0 4px}.badge{display:inline-block;padding:5px 8px;border-radius:8px;background:#e7f6e9;color:#17622d;font-size:12px;margin:4px 0}.warn{background:#fff0bd;color:#765400}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.brand{font-weight:900;font-size:23px;letter-spacing:-1px}.mark{display:inline-block;background:#ffd600;color:#19171c;border-radius:55% 45% 65% 35%;padding:5px 8px;transform:rotate(-15deg);margin-right:6px}.line{border-bottom:1px solid #eee;padding:12px 0}.muted{color:#777}.notice{background:#fff4cc;padding:12px;border-radius:12px;font-size:13px}.full{width:100%;margin-top:10px}.back{background:none;padding-left:0}dialog{border:0;border-radius:20px;width:min(92%,500px);padding:20px}dialog::backdrop{background:#0008}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#27113f;color:white;padding:12px 20px;border-radius:12px;z-index:10;display:none;max-width:90%} @media(min-width:650px){.catalog{grid-template-columns:repeat(3,1fr)}} </style><header><div><div class="brand"><span class="mark">••</span>STAGE BASE<span style="color:#e6bc00">⌝</span></div><small>by Stage Show Company</small></div><button onclick="go('profile')">◉</button></header><main id="app"></main><nav><button onclick="go('home')"><b>⌂</b>Головна</button><button onclick="go('catalog')"><b>▦</b>Каталог</button><button class="scan" onclick="go('lookup')">▣</button><button onclick="go('shows')"><b>▤</b>Шоу</button><button onclick="go('profile')"><b>◎</b>Профіль</button></nav><dialog id="modal"></dialog><div id="toast"></div><script>
const shows=['Резиденція Санти','Вартові мрій','Мавка','Потяг у дива'], warehouses=['ВДНГ','FILM.UA'], cats=['Декорації','Реквізит','Меблі','Технічне обладнання','Інструменти','Витратні матеріали','Костюми й аксесуари','Офісне обладнання','Інше'], roles=['Головний продюсер','Креативний продюсер','Директор компанії','Директор з маркетингу','Фінансовий директор','Продюсер шоу','Комірник','Працівник'];
const seed=[['Крісло тронне','Меблі',0,0,false,'🪑'],['Фотозона Київстар','Декорації',0,0,true,'🎁'],['Люстра кришталева','Технічне обладнання',1,1,false,'💡'],['Декоративна скриня','Реквізит',1,0,false,'🧰'],['Брендований лайтбокс','Декорації',2,1,true,'▣'],['Декоративна арка','Декорації',2,0,false,'🏛️']].map((x,i)=>({id:'SB-'+String(i+1).padStart(5,'0'),name:x[0],cat:x[1],show:shows[x[2]],loc:warehouses[x[3]],marketing:x[4],icon:x[5],condition:i===4?'Потребує ремонту':'Справний',verified:true,history:[],bookings:[],photo:''}));
let state;try{state=JSON.parse(localStorage.getItem('stagebase01'))}catch{}state=state||{assets:seed,role:roles[0],show:shows[0]};let page='home',selected='',filter={q:'',cat:'',show:'',loc:'',marketing:false,condition:''};const app=document.querySelector('#app'),modal=document.querySelector('#modal');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('stagebase01',JSON.stringify(state));return true}catch{toast('Не вдалося зберегти: сховище заповнене');return false}}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}function go(p){page=p;render();scrollTo(0,0)}function opts(arr,v=''){return arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}function photo(a){return `<div class="photo">${a.photo?`<img src="${esc(a.photo)}">`:esc(a.icon||'📦')}</div>`}function status(a){return a.issued?'Видано':!a.verified?'Не перевірено':a.condition!=='Справний'?a.condition:a.bookings.some(b=>b.status==='Погоджено')?'Заброньовано':'Доступне'}function card(a){return `<article class="card asset" onclick="detail('${a.id}')">${photo(a)}<h3>${esc(a.name)}</h3><small>${esc(a.id)} · ${esc(a.loc)}</small><br><span class="badge ${status(a)!=='Доступне'?'warn':''}">${status(a)}</span>${a.marketing?' <small>Маркетинг</small>':''}</article>`}function detail(id){selected=id;go('detail')}function log(a,t){a.history.unshift({t,role:state.role,date:new Date().toLocaleString('uk-UA')});save()}function canAdd(){return ['Головний продюсер','Креативний продюсер','Комірник','Продюсер шоу'].includes(state.role)}function canApprove(a){return state.role===roles[0]||(state.role==='Продюсер шоу'&&state.show===a.show)}function render(){let A=state.assets; if(page==='home'){app.innerHTML=`<small>ДЕМОНСТРАЦІЙНА ВЕРСІЯ · v0.1</small><h1>Вітаємо!</h1><div class="muted">${esc(state.role)}</div><div class="hero"><small>STAGE SHOW COMPANY</small><h1>${shows.length} шоу</h1>Єдина база майна компанії <button class="primary full" onclick="go('shows')">Переглянути шоу →</button></div><div class="grid">${[['Усього майна',A.length],['На складах',A.filter(a=>warehouses.includes(a.loc)).length],['Заброньовано',A.filter(a=>status(a)==='Заброньовано').length],['Потребує ремонту',A.filter(a=>a.condition==='Потребує ремонту').length]].map(([n,v])=>`<div class="card metric"><small>${n}</small><strong>${v}</strong></div>`).join('')}</div><h2>Швидкі дії</h2><div class="grid"><button onclick="go('catalog')">▦ Знайти майно</button><button onclick="go('operations')">↔ Операції</button>${canAdd()?'<button onclick="add()">＋ Додати майно</button>':''}<button onclick="go('lookup')">▣ Інвентарний №</button></div><h2>Майно компанії</h2><div class="grid">${A.slice(0,4).map(card).join('')}</div>`}else if(page==='catalog'){app.innerHTML=`<h1>Каталог майна</h1><input placeholder="Пошук назви або номера" value="${esc(filter.q)}" oninput="filter.q=this.value;results()"><div class="row"><select onchange="filter.cat=this.value;results()"><option value="">Усі категорії</option>${opts(cats,filter.cat)}</select><select onchange="filter.show=this.value;results()"><option value="">Усі шоу</option>${opts(shows,filter.show)}</select></div><div class="row"><select onchange="filter.loc=this.value;results()"><option value="">Усі місця</option>${opts([...warehouses,...shows],filter.loc)}</select><select onchange="filter.condition=this.value;results()"><option value="">Усі стани</option>${opts(['Справний','Потребує ремонту','Не перевірено'],filter.condition)}</select></div><label><input style="width:auto" type="checkbox" ${filter.marketing?'checked':''} onchange="filter.marketing=this.checked;results()"> Маркетинговий реквізит</label>${canAdd()?'<button class="primary full" onclick="add()">＋ Додати майно</button>':''}<p id="count"></p><div id="results" class="grid catalog"></div>`;results()}else if(page==='detail'){let a=A.find(x=>x.id===selected);app.innerHTML=`<button class="back" onclick="go('catalog')">← Каталог</button>${photo(a)}<h1>${esc(a.name)}</h1><small>${esc(a.id)}</small> <span class="badge">${status(a)}</span><button class="primary full" onclick="book()">Забронювати</button><div class="card" style="margin-top:15px">${[['Категорія',a.cat],['Шоу',a.show],['Місцеперебування',a.loc],['Стан',a.condition],['Перевірка',a.verified?'Перевірено':'Не перевірено'],['Маркетинг',a.marketing?'Так':'Ні'],['Габарити',a.dim||'Не вказано'],['Матеріал',a.material||'Не вказано']].map(([k,v])=>`<div class="line"><small>${k}</small><br><b>${esc(v)}</b></div>`).join('')}</div><h2>Бронювання</h2>${a.bookings.map((b,i)=>`<div class="card"><b>${esc(b.show)}</b><p>${esc(b.start)} — ${esc(b.end)} · ${esc(b.person)}</p><span class="badge">${b.status}</span>${b.status==='Запит'&&canApprove(a)?`<div class="row"><button onclick="approve(${i},true)">Погодити</button><button onclick="approve(${i},false)">Відхилити</button></div>`:''}${b.status==='Погоджено'&&state.role==='Комірник'&&!a.issued?`<button class="primary full" onclick="issue(${i})">Видати</button>`:''}</div>`).join('')||'<small>Немає бронювань</small>'}${a.issued&&state.role==='Комірник'?'<button class="primary full" onclick="receive()">Повернути на склад</button>':''}${!a.verified&&!a.issued&&canAdd()?'<button class="full" onclick="inspect()">Перевірити з фото</button>':''}<h2>Історія операцій</h2>${a.history.map(h=>`<div class="line">${esc(h.t)}<br><small>${esc(h.date)} · ${esc(h.role)}</small></div>`).join('')||'<small>Історія поки порожня</small>'}`}else if(page==='shows'){app.innerHTML='<h1>Шоу та склади</h1>'+[...shows,...warehouses].map(x=>`<div class="card line" onclick="openGroup('${x}')"><b>${x}</b><p>${A.filter(a=>a.show===x||a.loc===x).length} позицій →</p></div>`).join('')}else if(page==='profile'){app.innerHTML=`<h1>Профіль</h1><div class="notice">Демо: перемикання ролей без реальної авторизації.</div><label>Посада<select onchange="state.role=this.value;save();render()">${opts(roles,state.role)}</select></label><label>Закріплене шоу<select onchange="state.show=this.value;save()">${opts(shows,state.show)}</select></label><button class="full" onclick="go('operations')">Кабінет операцій</button><button class="full" onclick="if(confirm('Скинути всі локальні зміни?')){localStorage.removeItem('stagebase01');location.reload()}">Скинути демонстрацію</button>`}else if(page==='lookup'){app.innerHTML=`<h1>Пошук за номером</h1><div class="notice">Камерне QR-сканування ще не підключене.</div><input id="num" placeholder="SB-00001"><button class="primary full" onclick="let a=state.assets.find(x=>x.id.toLowerCase()===document.querySelector('#num').value.trim().toLowerCase());a?detail(a.id):toast('Не знайдено')">Знайти</button>`}else{app.innerHTML=`<h1>Кабінет операцій</h1><div class="notice">Для погодження обери роль головного продюсера, для видачі — комірника.</div><h2>Запити та видача</h2>${A.filter(a=>a.bookings.length||a.issued||!a.verified).map(card).join('')||'<p>Немає операцій</p>'}`}}
function results(){let a=state.assets.filter(a=>(a.name+' '+a.id).toLowerCase().includes(filter.q.toLowerCase())&&(!filter.cat||a.cat===filter.cat)&&(!filter.show||a.show===filter.show)&&(!filter.loc||a.loc===filter.loc)&&(!filter.marketing||a.marketing)&&(!filter.condition||(filter.condition==='Не перевірено'?!a.verified:a.condition===filter.condition)));document.querySelector('#count').textContent=a.length+' позицій';document.querySelector('#results').innerHTML=a.map(card).join('')||'<p>Нічого не знайдено</p>'}function openGroup(x){filter={q:'',cat:'',show:shows.includes(x)?x:'',loc:warehouses.includes(x)?x:'',marketing:false,condition:''};go('catalog')}function form(title,body,fn){modal.innerHTML=`<h2>${title}</h2><form>${body}<button class="primary full" type="submit">Зберегти</button><button class="full" type="button" onclick="modal.close()">Скасувати</button></form>`;modal.querySelector('form').onsubmit=async e=>{e.preventDefault();if(await fn(new FormData(e.target))!==false){modal.close();render()}};modal.showModal()}function field(n,t,type='text',req=true){return `<label>${t}<input name="${n}" type="${type}" ${req?'required':''}></label>`}function sel(n,t,arr){return `<label>${t}<select name="${n}">${opts(arr)}</select></label>`}async function imageData(f){if(!f||!f.size)return '';return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,800/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.75))};i.onerror=reject;i.src=r.result};r.onerror=reject;r.readAsDataURL(f)})}function add(){if(!canAdd())return;form('Нове майно',field('name','Назва')+sel('cat','Категорія',cats)+sel('show','Шоу',[...shows,'Загальний фонд'])+sel('loc','Склад',warehouses)+field('dim','Габарити','text',false)+field('material','Матеріал','text',false)+'<label><input type="checkbox" name="marketing" style="width:auto"> Маркетингове призначення</label><label>Фото<input type="file" name="photo" accept="image/*" required></label>',async f=>{let p;try{p=await imageData(f.get('photo'))}catch{toast('Не вдалося прочитати фото');return false}let a={id:'SB-'+String(Date.now()).slice(-9),name:f.get('name'),cat:f.get('cat'),show:f.get('show'),loc:f.get('loc'),dim:f.get('dim'),material:f.get('material'),marketing:f.has('marketing'),photo:p,condition:'Справний',verified:false,history:[],bookings:[]};state.assets.push(a);log(a,'Додано майно');selected=a.id;page='detail'})}function book(){let a=state.assets.find(x=>x.id===selected);form('Запит на бронювання',sel('show','Шоу отримувача',shows)+field('start','Початок','date')+field('end','Кінець','date')+field('person','Відповідальна особа'),f=>{let b=Object.fromEntries(f);if(b.end<b.start){toast('Перевірте дати');return false}b.status='Запит';a.bookings.push(b);log(a,'Створено запит на бронювання')})}function approve(i,yes){let a=state.assets.find(x=>x.id===selected),b=a.bookings[i];if(!canApprove(a)||b.status!=='Запит')return;if(yes&&a.bookings.some((x,j)=>j!==i&&['Погоджено','Видано'].includes(x.status)&&x.start<=b.end&&x.end>=b.start)){toast('Конфлікт бронювання');return}b.status=yes?'Погоджено':'Відхилено';log(a,b.status);render()}function issue(i){let a=state.assets.find(x=>x.id===selected),b=a.bookings[i];if(state.role!=='Комірник'||a.issued||!a.verified||a.condition!=='Справний'||b.status!=='Погоджено'||!warehouses.includes(a.loc)){toast('Видачу заблоковано');return}if(!confirm('Комплектність і стан відповідають останнім фото?'))return;a.issued=true;a.loc=b.show;b.status='Видано';log(a,'Видано: '+b.person);render()}function receive(){let a=state.assets.find(x=>x.id===selected);if(state.role!=='Комірник'||!a.issued)return;form('Повернення',sel('loc','Склад',warehouses),f=>{a.loc=f.get('loc');a.issued=false;a.verified=false;a.bookings.filter(b=>b.status==='Видано').forEach(b=>b.status='Повернено');let d=new Date();d.setDate(d.getDate()+7);log(a,'Повернено. Перевірити до '+d.toLocaleDateString('uk-UA'))})}function inspect(){let a=state.assets.find(x=>x.id===selected);form('Перевірка',sel('condition','Стан',['Справний','Потребує ремонту','Непридатний'])+'<label>Актуальне фото<input type="file" name="photo" accept="image/*" required></label>',async f=>{try{let p=await imageData(f.get('photo'));a.photo=p;a.condition=f.get('condition');a.verified=true;log(a,'Перевірено: '+a.condition)}catch{toast('Помилка фото');return false}})}render();</script></html>
