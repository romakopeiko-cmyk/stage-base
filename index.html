.role===roles[0]||(state.role==='Продюсер шоу'&&state.show===a.show)}function render(){let A=state.assets;document.body.dataset.page=page;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')===`go('${page}')`)); if(page==='home'){app.innerHTML=`<small>ДЕМО · v0.2</small><div class="greeting">Вітаємо,<h1>${esc(state.role)}</h1></div><button class="hero" onclick="go('shows')"><span>Активні шоу<strong>${shows.length}</strong></span><i>›</i></button><div class="grid">${[['Усього майна',A.length],['На складах',A.filter(a=>warehouses.includes(a.loc)).length],['Заброньовано',A.filter(a=>status(a)==='Заброньовано').length],['Потребує ремонту',A.filter(a=>a.condition==='Потребує ремонту').length]].map(([n,v],i)=>`<div class="card metric">${ico(["box","layers","calendar","tool"][i])}<small>${n}</small><strong>${v}</strong></div>`).join('')}</div><h2>Швидкі дії</h2><div class="quick"><button onclick="go('catalog')">${ico("calendar")}Знайти</button><button onclick="go('operations')">${ico("layers")}Операції</button><button onclick="go('lookup')">${ico("lookup")}Номер</button>${canAdd()?`<button onclick="add()">${ico("plus")}Додати</button>`:""}</div><h2>Майно компанії</h2><div class="grid">${A.slice(0,4).map(card).join('')}</div>`}else if(page==='catalog'){app.innerHTML=`<h1>Каталог майна</h1><input placeholder="Пошук назви або номера" value="${esc(filter.q)}" oninput="filter.q=this.value;results()"><div class="row"><select onchange="filter.cat=this.value;results()"><option value="">Усі категорії</option>${opts(cats,filter.cat)}</select><select onchange="filter.show=this.value;results()"><option value="">Усі шоу</option>${opts(shows,filter.show)}</select></div><div class="row"><select onchange="filter.loc=this.value;results()"><option value="">Усі місця</option>${opts([...warehouses,...shows],filter.loc)}</select><select onchange="filter.condition=this.value;results()"><option value="">Усі стани</option>${opts(['Справний','Потребує ремонту','Не перевірено'],filter.condition)}</select></div><label><input style="width:auto" type="checkbox" ${filter.marketing?'checked':''} onchange="filter.marketing=this.checked;results()"> Маркетинговий реквізит</label>${canAdd()?'<button class="primary full" onclick="add()">＋ Додати майно</button>':''}<div id="categories" class="grid categorygrid"></div><p id="count"></p><div id="results" class="grid catalog"></div>`;results()}else if(page==='detail'){let a=A.find(x=>x.id===selected);app.innerHTML=`<button class="back" onclick="go('catalog')">← Каталог</button>${photo(a)}<h1>${esc(a.name)}</h1><small>${esc(a.id)}</small> <span class="badge">${status(a)}</span><button class="primary full" onclick="book()">Забронювати</button><div class="card" style="margin-top:15px">${[['Категорія',a.cat],['Шоу',a.show],['Місцеперебування',a.loc],['Стан',a.condition],['Перевірка',a.verified?'Перевірено':'Не перевірено'],['Маркетинг',a.marketing?'Так':'Ні'],['Габарити',a.dim||'Не вказано'],['Матеріал',a.material||'Не вказано']].map(([k,v])=>`<div class="line"><small>${k}</small><br><b>${esc(v)}</b></div>`).join('')}</div><h2>Бронювання</h2>${a.bookings.map((b,i)=>`<div class="card"><b>${esc(b.show)}</b><p>${esc(b.start)} — ${esc(b.end)} · ${esc(b.person)}</p><span class="badge">${b.status}</span>${b.status==='Запит'&&canApprove(a)?`<div class="row"><button onclick="approve(${i},true)">Погодити</button><button onclick="approve(${i},false)">Відхилити</button></div>`:''}${b.status==='Погоджено'&&state.role==='Комірник'&&!a.issued?`<button class="primary full" onclick="issue(${i})">Видати</button>`:''}</div>`).join('')||'<small>Немає бронювань</small>'}${a.issued&&state.role==='Комірник'?'<button class="primary full" onclick="receive()">Повернути на склад</button>':''}${!a.verified&&!a.issued&&canAdd()?'<button class="full" onclick="inspect()">Перевірити з фото</button>':''}<h2>Історія операцій</h2>${a.history.map(h=>`<div class="line">${esc(h.t)}<br><small>${esc(h.date)} · ${esc(h.role)}</small></div>`).join('')||'<small>Історія поки порожня</small>'}`}else if(page==='shows'){app.innerHTML='<h1>Шоу та склади</h1>'+[...shows,...warehouses].map(x=>`<div class="card line" onclick="openGroup('${x}')"><b>${x}</b><p>${A.filter(a=>a.show===x||a.loc===x).length} позицій →</p></div>`).join('')}else if(page==='profile'){app.innerHTML=`<h1>Профіль</h1><div class="notice">Демо: перемикання ролей без реальної авторизації.</div><label>Посада<select onchange="state.role=this.value;save();render()">${opts(roles,state.role)}</select></label><label>Закріплене шоу<select onchange="state.show=this.value;save()">${opts(shows,state.show)}</select></label><button class="full" onclick="go('operations')">Кабінет операцій</button><button class="full" onclick="if(confirm('Скинути всі локальні зміни?')){localStorage.removeItem('stagebase01');location.reload()}">Скинути демонстрацію</button>`}else if(page==='lookup'){app.innerHTML=`<h1>Пошук за номером</h1><div class="notice">Камерне QR-сканування ще не підключене.</div><input id="num" placeholder="SB-00001"><button class="primary full" onclick="let a=state.assets.find(x=>x.id.toLowerCase()===document.querySelector('#num').value.trim().toLowerCase());a?detail(a.id):toast('Не знайдено')">Знайти</button>`}else{app.innerHTML=`<h1>Кабінет комірника</h1><div class="warehouseops">${[["box","Видача реквізиту"],["layers","Повернення"],["shows","Переміщення"],["calendar","Інвентаризація"]].map(([i,n])=>`<button onclick="go('catalog')">${ico(i)} ${n} <span>›</span></button>`).join("")}</div><div class="notice">Для погодження обери роль головного продюсера, для видачі — комірника.</div><h2>Запити та видача</h2>${A.filter(a=>a.bookings.length||a.issued||!a.verified).map(card).join('')||'<p>Немає операцій</p>'}`}}
function results(){let cg=document.querySelector('#categories');if(cg)cg.innerHTML=(!filter.q&&!filter.cat&&!filter.show&&!filter.loc&&!filter.marketing&&!filter.condition)?[['Меблі',0,'Меблі'],['Освітлення',2,'Технічне обладнання'],['Реквізит',3,'Реквізит'],['Конструкції',4,'Декорації'],['Декорації',5,'Декорації'],['Текстиль',6,'Витратні матеріали']].map(([n,i,c])=>`<button class="category" style="background-image:linear-gradient(transparent 35%,#000d),url('${artwork[i]}')" onclick="filter.cat='${c}';render()"><span>${n}<br>${state.assets.filter(a=>a.cat===c).length} позицій</span><i>›</i></button>`).join(''):'';let a=state.assets.filter(a=>(a.name+' '+a.id).toLowerCase().includes(filter.q.toLowerCase())&&(!filter.cat||a.cat===filter.cat)&&(!filter.show||a.show===filter.show)&&(!filter.loc||a.loc===filter.loc)&&(!filter.marketing||a.marketing)&&(!filter.condition||(filter.condition==='Не перевірено'?!a.verified:a.condition===filter.condition)));document.querySelector('#count').textContent=a.length+' позицій';document.querySelector('#results').innerHTML=a.map(card).join('')||'<p>Нічого не знайдено</p>'}function openGroup(x){filter={q:'',cat:'',show:shows.includes(x)?x:'',loc:warehouses.includes(x)?x:'',marketing:false,condition:''};go('catalog')}function form(title,body,fn){modal.innerHTML=`<h2>${title}</h2><form>${body}<button class="primary full" type="submit">Зберегти</button><button class="full" type="button" onclick="modal.close()">Скасувати</button></form>`;modal.querySelector('form').onsubmit=async e=>{e.preventDefault();if(await fn(new FormData(e.target))!==false){modal.close();render()}};modal.showModal()}function field(n,t,type='text',req=true){return `<label>${t}<input name="${n}" type="${type}" ${req?'required':''}></label>`}function sel(n,t,arr){return `<label>${t}<select name="${n}">${opts(arr)}</select></label>`}async function imageData(f){if(!f||!f.size)return '';return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,800/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.75))};i.onerror=reject;i.src=r.result};r.onerror=reject;r.readAsDataURL(f)})}function add(){if(!canAdd())return;form('Нове майно',field('name','Назва')+sel('cat','Категорія',cats)+sel('show','Шоу',[...shows,'Загальний фонд'])+sel('loc','Склад',warehouses)+field('dim','Габарити','text',false)+field('material','Матеріал','text',false)+'<label><input type="checkbox" name="marketing" style="width:auto"> Маркетингове призначення</label><label>Фото<input type="file" name="photo" accept="image/*" required></label>',async f=>{let p;try{p=await imageData(f.get('photo'))}catch{toast('Не вдалося прочитати фото');return false}let a={id:'SB-'+String(Date.now()).slice(-9),name:f.get('name'),cat:f.get('cat'),show:f.get('show'),loc:f.get('loc'),dim:f.get('dim'),material:f.get('material'),marketing:f.has('marketing'),photo:p,condition:'Справний',verified:false,history:[],bookings:[]};state.assets.push(a);log(a,'Додано майно');selected=a.id;page='detail'})}function book(){let a=state.assets.find(x=>x.id===selected);form('Запит на бронювання',sel('show','Шоу отримувача',shows)+field('start','Початок','date')+field('end','Кінець','date')+field('person','Відповідальна особа'),f=>{let b=Object.fromEntries(f);if(b.end<b.start){toast('Перевірте дати');return false}b.status='Запит';a.bookings.push(b);log(a,'Створено запит на бронювання')})}function approve(i,yes){let a=state.assets.find(x=>x.id===selected),b=a.bookings[i];if(!canApprove(a)||b.status!=='Запит')return;if(yes&&a.bookings.some((x,j)=>j!==i&&['Погоджено','Видано'].includes(x.status)&&x.start<=b.end&&x.end>=b.start)){toast('Конфлікт бронювання');return}b.status=yes?'Погоджено':'Відхилено';log(a,b.status);render()}function issue(i){let a=state.assets.find(x=>x.id===selected),b=a.bookings[i];if(state.role!=='Комірник'||a.issued||!a.verified||a.condition!=='Справний'||b.status!=='Погоджено'||!warehouses.includes(a.loc)){toast('Видачу заблоковано');return}if(!confirm('Комплектність і стан відповідають останнім фото?'))return;a.issued=true;a.loc=b.show;b.status='Видано';log(a,'Видано: '+b.person);render()}function receive(){let a=state.assets.find(x=>x.id===selected);if(state.role!=='Комірник'||!a.issued)return;form('Повернення',sel('loc','Склад',warehouses),f=>{a.loc=f.get('loc');a.issued=false;a.verified=false;a.bookings.filter(b=>b.status==='Видано').forEach(b=>b.status='Повернено');let d=new Date();d.setDate(d.getDate()+7);log(a,'Повернено. Перевірити до '+d.toLocaleDateString('uk-UA'))})}function inspect(){let a=state.assets.find(x=>x.id===selected);form('Перевірка',sel('condition','Стан',['Справний','Потребує ремонту','Непридатний'])+'<label>Актуальне фото<input type="file" name="photo" accept="image/*" required></label>',async f=>{try{let p=await imageData(f.get('photo'));a.photo=p;a.condition=f.get('condition');a.verified=true;log(a,'Перевірено: '+a.condition)}catch{toast('Помилка фото');return false}})}render();</script></html>
