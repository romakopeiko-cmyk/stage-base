.photo .placeholder small{display:block;max-width:100%;font-size:12px;line-height:1.25;white-space:normal;overflow-wrap:normal;word-break:normal;color:#777}
.recentrow .photo .placeholder{padding:3px;gap:3px}
.recentrow .photo .placeholder svg{width:19px;height:19px}
.recentrow .photo .placeholder small{font-size:9px}
.brandlock,.brandlock .mascot,.brandwords,.brandwords small,.loginbrand,.loginbrand .mascot{background:transparent!important;box-shadow:none;border:0}
.brandlock{max-width:calc(100% - 45px);padding:0;flex-shrink:1}
.brandwords{font-size:clamp(17px,5vw,23px)}
.brandwords small{font-size:9px}
.asset h3,.asset small{overflow-wrap:anywhere}
@media(max-width:360px){.photo .placeholder small{font-size:11px}.brandlock .mascot{width:32px}}

/* iOS: keep the layout inside the viewport, including intrinsic grid sizes. */
html,body{width:100%;max-width:100%;margin:0;overflow-x:hidden;overscroll-behavior-x:none}
@supports (overflow:clip){html,body{overflow-x:clip}}
header,main,nav{width:100%;min-width:0}
header>*{min-width:0}
main>*{min-width:0;max-width:100%}
.grid,.quick,.categorygrid,.catalog{min-width:0;max-width:100%}
.quick{grid-template-columns:repeat(4,minmax(0,1fr))}
.quick button{min-width:0;max-width:100%;overflow-wrap:anywhere}
.hero,.category{min-width:0;max-width:100%}
.hero i{flex-shrink:0}
nav{width:100%;left:0;right:0}
nav button:not(.scan){flex:1 1 0;min-width:0}
nav .scan{flex:0 0 54px}
.row>*{min-width:0}
.chips{max-width:100%;min-width:0;overscroll-behavior-x:contain}
.loginpage{width:100%;min-width:0}
body[data-page=detail] .photo{width:calc(100% + 32px);max-width:calc(100% + 32px)}
@media(min-width:750px){body[data-page=detail] .photo{width:100%;max-width:100%}}
@media(max-width:749px){header{padding-top:max(14px,env(safe-area-inset-top))}body[data-page=catalog] main,body[data-page=detail] main,body[data-page=operations] main{padding-top:max(8px,env(safe-area-inset-top))}}

/* Safari focuses inputs below 16px by zooming the visual viewport.
   Keep normal pinch zoom available, but prevent automatic form zoom. */
html,body{overflow-x:hidden;overscroll-behavior-x:none}
@media(max-width:749px){
  input:not([type=checkbox]):not([type=radio]),select,textarea,
  .loginfield input,.searchbar input,.filterbox select{font-size:16px!important}
  header,main,nav{width:100%;max-width:100%;min-width:0}
  nav{padding-bottom:calc(7px + env(safe-area-inset-bottom,0px))}
  main{padding-bottom:calc(94px + env(safe-area-inset-bottom,0px))}
  body[data-page=login] main{padding:0}
  body[data-page=detail] main{padding-bottom:28px}
}

.task-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin:8px 0}
.task-week button{padding:9px 1px;min-width:0;min-height:44px;font-size:11px}
.task-week button[aria-pressed=true]{background:#6634a5;color:white}
.task-column{border:1px solid #e4ddeb;border-radius:12px;padding:10px;margin:12px 0}
.card[data-priority=critical]{border-left:4px solid #c1263b}.card[data-priority=high]{border-left:4px solid #d87617}
.card[data-priority=medium]{border-left:4px solid #c8a721}.card[data-priority=low]{border-left:4px solid #27844c}
.task-overdue{color:#a61e32}.card h3{overflow-wrap:anywhere}textarea{width:100%;min-height:90px;font:inherit}

.task-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.task-heading h1{margin:0}.task-heading button,.task-views button{min-height:44px}
.task-views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;background:#eee8f6;border-radius:12px}
.task-views button{padding:5px 2px;background:transparent;color:#392758;font-size:13px;min-width:0}
.task-views button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px #39275826;color:#4e2479}
.task-filters{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:10px;margin-top:10px}
.task-filters label{min-width:0}.task-filters input,.task-filters select{width:100%}
.task-card{padding:0;margin:8px 0;overflow:hidden}
.task-card-open{background:transparent;color:inherit;text-align:left;width:100%;display:grid;gap:6px;min-height:54px;padding:12px;overflow-wrap:anywhere}
.task-card-open strong{font-size:16px}.task-card-open small{color:#6b5a7e}
.task-card-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.task-card-meta span{border-radius:7px;background:#f0ebf7;padding:3px 7px}
.task-card-meta .task-overdue{background:#fbe7eb}
.task-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.task-board .task-column{margin:0;min-width:0}
@media(max-width:480px){.task-board{grid-template-columns:minmax(0,1fr)}}

.calendar-modes,.calendar-navigation{display:flex;gap:6px;align-items:center;margin:8px 0}
.calendar-modes button,.calendar-navigation button{min-height:44px}
.calendar-modes button{flex:1}
.calendar-modes button[aria-pressed=true]{background:#6634a5;color:white}
.calendar-navigation{justify-content:space-between;text-align:center}
.calendar-navigation button{min-width:44px}
.task-week .calendar-outside{opacity:.55}
.task-week .calendar-has-events{box-shadow:inset 0 -3px #a278ca}
.task-comment-body{white-space:pre-wrap;overflow-wrap:anywhere}

async function liveUpload(input,bucket){const f=input.files[0],id=active?.id;if(!f||!id||busy)return;busy=true;input.disabled=true;try{const path=id+'/'+crypto.randomUUID();await take(db.storage.from(bucket).upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false}));const photo=bucket==='asset-photos';const row=photo?{asset_id:id,storage_path:path}:{asset_id:id,storage_path:path,name:f.name,file_size:f.size,mime_type:f.type};await take(db.from(photo?'asset_photos':'asset_documents').insert(row));toast('Файл збережено');await liveFiles(id)}catch(e){fail(e)}finally{busy=false;input.disabled=false;input.value=''}}
function render(){document.body.dataset.page=page;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')==="go('"+page+"')"));if(!me){document.body.dataset.page='login';app.innerHTML='<section class="loginpage"><div class="loginbrand">'+mascotMarkup+'<strong>STAGE<br>BASE</strong><p>by Stage Show Company</p></div><form class="loginform" onsubmit="loginLive(event)"><h1>Вхід у систему</h1><div class="loginfield">'+ico('mail')+'<input name="email" type="email" placeholder="Email" autocomplete="username" required></div><div class="loginfield">'+ico('lock')+'<input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required></div><button class="primary" type="submit">Увійти</button><p class="demohint">Доступ лише для запрошених працівників.</p></form></section>';return}
if(page==='home'){app.innerHTML='<div class="greeting">Вітаємо,<h1>'+esc(me.full_name)+'</h1><small>'+esc(me.role.name)+'</small><p>'+esc(new Date().toLocaleDateString('uk-UA',{dateStyle:'full'}))+'</p></div><h2>Персональний календар</h2><div id="task-home"></div><button class="full" id="open-task-calendar">Відкрити календар</button><button class="primary full" onclick="go(\'tasks\')">Мої завдання</button>'+(roleCode()==='warehouse_manager'?'<button class="full" onclick="go(\'operations\')">Складські операції</button>':'')+'<button class="hero" onclick="go(\'shows\')"><span>Шоу<strong>'+refs.shows.length+'</strong></span></button><div class="grid">'+[['Усього майна',records.length],['На складах',records.filter(a=>a.location_type==='warehouse').length],['Не перевірено',records.filter(a=>a.condition==='unverified').length],['Пошкоджено',records.filter(a=>a.condition==='damaged').length]].map(([n,v])=>'<div class="card metric"><small>'+n+'</small><strong>'+v+'</strong></div>').join('')+'</div><button class="primary full" onclick="go(\'catalog\')">Каталог майна</button><button class="full" onclick="go(\'reservations\')">Бронювання</button>'+(createOK()?'<button class="full" onclick="liveForm()">＋ Додати майно</button>':'');app.querySelector('#open-task-calendar').onclick=()=>{taskMode='calendar';go('tasks')};loadTaskHome(app.querySelector('#task-home'));return}
if(page==='catalog'){renderCatalog();return}
if(page==='detail'&&active){const a=active;app.innerHTML='<button class="back" onclick="go(\'catalog\')">← Каталог</button><h1>'+esc(a.name)+'</h1><small>'+esc(a.inventory_number)+'</small><div class="card">'+[['Категорія',nameOf('categories',a.category_id)],['Шоу',nameOf('shows',a.show_id)],['Місце',locationOf(a)],['Стан',cond(a.condition)],['Кількість',a.quantity+' '+a.unit],['Матеріал',a.material],['Колір',a.color],['Габарити, см',[a.width_cm,a.depth_cm,a.height_cm].join(' × ')],['QR-код',a.qr_code],['Опис',a.description],['Коментар',a.notes],['Дедлайн перевірки',a.inspection_due_at?new Date(a.inspection_due_at).toLocaleDateString('uk-UA'):'—']].map(([k,v])=>'<div class="line"><small>'+k+'</small><br><b>'+esc(v||'—')+'</b></div>').join('')+'</div>'+(editOK()?'<button class="primary full" onclick="liveForm(active)">Редагувати</button>':'')+'<div id="livefiles"></div><div id="liveextra"></div>';if(a.qr_code){const labelButton=document.createElement('button');labelButton.textContent='Друк QR-етикетки';labelButton.className='full';labelButton.onclick=()=>printAssetLabel(a).catch(fail);app.querySelector('h1').after(labelButton)};liveFiles(a.id);liveExtra(a.id);return}
if(page==='shows'){app.innerHTML='<h1>Шоу та склади</h1>'+['shows','warehouses'].map(t=>'<h2>'+(t==='shows'?'Шоу':'Склади')+'</h2>'+refs[t].map(x=>'<div class="card line"><b>'+esc(x.name)+'</b><p>'+records.filter(a=>a[t==='shows'?'show_id':'warehouse_id']===x.id).length+' позицій</p></div>').join('')).join('');return}
if(page==='reservations'){renderReservations();return}
if(page==='tasks'){renderTasks();return}
if(page==='import-intake'){renderImportIntake();return}
if(page==='notifications'){renderInbox();return}
if(page==='profile'){app.innerHTML='<h1>Профіль</h1><div class="card"><b>'+esc(me.full_name)+'</b><p>'+esc(me.role.name)+'</p><small>'+esc(me.email)+'</small></div>'+(intakeRole()?'<button class="full" onclick="go(\'import-intake\')">Майно потребує уточнення</button>':'')+'<button class="full" onclick="logoutLive()">Вийти</button>';return}
if(page==='lookup'){
 renderLookup(app, code => {
  const query = code.trim().toLowerCase();
  const asset = query && records.find(item =>
   [item.inventory_number, item.qr_code].some(value => String(value ?? '').toLowerCase() === query)
  );
  if (!asset) {
   toast('Майно не знайдено');
   return;
  }
  liveDetail(asset.id);
 });
 return;
}
app.innerHTML='<h1>Операції</h1><button class="primary full" onclick="go(\'reservations\')">Бронювання</button><div class="notice">Видача та приймання ще не підключені.</div>'};

async function renderInbox() {
 app.innerHTML = '<h1>Сповіщення</h1><div id="inbox" aria-live="polite">Завантаження…</div>';
 const inbox = document.querySelector('#inbox');
 const fields = 'id,title,message,created_at,is_read';
 let before;

 async function loadMore() {
  const more = inbox.querySelector('#inbox-more');
  if (more) more.disabled = true;
  try {
   let query = db.from('notifications').select(fields)
    .order('created_at', { ascending: false }).order('id', { ascending: false }).limit(30);
   if (before) query = query.or(`created_at.lt.${before.created_at},and(created_at.eq.${before.created_at},id.lt.${before.id})`);
   const rows = await take(query);
   if (!inbox.isConnected) return;
   if (more) more.remove();
   else inbox.replaceChildren();
   if (!rows.length && !before) inbox.textContent = 'Сповіщень поки немає.';

   for (const row of rows) {
    const card = document.createElement('article');
    card.className = 'card line';
    card.innerHTML = `<h2>${esc(row.title)}</h2><p>${esc(row.message)}</p>
      <small>${esc(new Date(row.created_at).toLocaleString('uk-UA'))}</small>`;
    if (!row.is_read) {
     const read = document.createElement('button');
     read.className = 'full';
     read.textContent = 'Позначити прочитаним';
     read.onclick = async () => {
      read.disabled = true;
      try {
       await take(db.from('notifications').update({ is_read: true }).eq('id', row.id));
       read.remove();
      } catch (error) {
       read.disabled = false;
       fail(error);
      }
     };
     card.append(read);
    }
    inbox.append(card);
   }
   if (rows.length === 30) {
    before = rows.at(-1);
    const next = document.createElement('button');
    next.id = 'inbox-more';
    next.className = 'full';
    next.textContent = 'Показати ще';
    next.onclick = loadMore;
    inbox.append(next);
   }
  } catch (error) {
   if (more) more.disabled = false;
   if (inbox.isConnected && !before) inbox.textContent = 'Не вдалося завантажити сповіщення.';
   fail(error);
  }
 }

 await loadMore();
}

async function liveExtra(id){try{const a=records.find(x=>x.id===id);const [parts,checks,history]=await Promise.all([take(db.from('asset_components').select('id,name,quantity,condition').eq('asset_id',id)),take(db.from('inspections').select('id,status,deadline_at,inspection_type').eq('asset_id',id)),take(db.from('audit_log').select('id,actor_name,description,created_at').eq('asset_id',id).order('created_at',{ascending:false}).limit(100))]);if(page!=='detail'||active?.id!==id)return;const el=document.querySelector('#liveextra');el.innerHTML=(a.tracking_type==='set'?'<h2>Складові комплекту</h2>'+parts.map(p=>'<div class="line">'+esc(p.name)+' · '+esc(p.quantity)+' шт. · '+esc(cond(p.condition))+'</div>').join('')+(editOK()&&a.condition==='unverified'?'<button class="full" onclick="livePart()">＋ Додати складову</button>':''):'')+'<h2>Перевірки</h2>'+checks.map(i=>'<div class="line">'+esc(i.status==='completed'?'Завершено':new Date(i.deadline_at)<new Date()?'Строк прострочено':'Очікує перевірки')+' · '+esc(new Date(i.deadline_at).toLocaleDateString('uk-UA'))+'</div>').join('')+(createOK()&&checks.some(i=>i.status!=='completed')?'<button class="primary full" id="finish-inspection">Завершити перевірку</button>':'')+'<h2>Історія</h2>'+history.map(h=>'<div class="line">'+esc(h.description)+'<br><small>'+esc(h.actor_name)+' · '+esc(new Date(h.created_at).toLocaleString('uk-UA'))+'</small></div>').join('');
 const finish=el.querySelector('#finish-inspection');
 if(finish)finish.onclick=()=>liveInspect(parts);
 if(roleCode()==='executive_producer'&&checks.some(i=>i.status!=='completed')){
  const deadline=document.createElement('button');
  deadline.className='full';
  deadline.textContent='Змінити строк перевірки';
  deadline.onclick=liveChangeInspectionDeadline;
  el.append(deadline);
 }
}catch(e){fail(e)}}
function livePart(){const id=active.id;form('Складова комплекту',field('name','Назва')+'<label>Кількість<input type="number" name="quantity" min="1" step="1" value="1" required></label>',async d=>{try{await take(db.from('asset_components').insert({asset_id:id,name:d.get('name'),quantity:Number(d.get('quantity'))}));return true}catch(e){fail(e);return false}})}
function liveInspect(parts){
 const asset=active;
 const set=asset.tracking_type==='set';
 if(set&&!parts.length){
  toast('Додайте складові комплекту перед перевіркою');
  return;
 }
 const conditions='<option value="">Оберіть стан</option><option value="good">Справний</option><option value="damaged">Пошкоджений</option><option value="unusable">Непридатний</option>';
 const checklist=set?parts.map(part=>`
  <fieldset class="line"><legend>${esc(part.name)} · очікується ${esc(part.quantity)} шт.</legend>
   <label>Фактична кількість<input name="actual" type="number" min="0" step="1" required></label>
   <label>Стан складової<select name="part_condition" required>${conditions}</select></label>
   ${field('part_comment','Коментар до складової','text',false)}
  </fieldset>`).join(''):'<label>Комплектність<select name="complete"><option value="true">Повна</option><option value="false">Неповна</option></select></label>';
 form('Перевірка майна','<p>Перед завершенням завантажте актуальне фото у картку.</p>'+
  '<label>Стан майна<select name="condition" required>'+conditions+'</select></label>'+
  checklist+field('comment','Коментар','text',false),async d=>{
   const quantities=d.getAll('actual'), states=d.getAll('part_condition'), comments=d.getAll('part_comment');
   try{
    await take(db.rpc('stage_finish_inspection',{
     p_asset:asset.id,p_condition:d.get('condition'),p_complete:set||d.get('complete')==='true',
     p_comment:d.get('comment'),p_checklist:set?parts.map((part,i)=>({
      id:part.id,quantity:Number(quantities[i]),condition:states[i],comment:comments[i]
     })):[]
    }));
    await loadLive();
    active=records.find(x=>x.id===asset.id);
    return true;
   }catch(e){fail(e);return false}
 });
}
function liveChangeInspectionDeadline(){
 const id=active.id;
 form('Змінити строк перевірки',field('deadline','Новий строк','datetime-local')+
  field('reason','Причина'),async d=>{
   try{
    await take(db.rpc('stage_change_inspection_deadline',{
     p_asset:id,p_deadline:new Date(d.get('deadline')).toISOString(),p_reason:d.get('reason')
    }));
    await loadLive();
    active=records.find(x=>x.id===id);
    return true;
   }catch(e){fail(e);return false}
 });
}

page='login';render();loadLive().then(()=>{if(me)go('home')}).catch(e=>{me=null;render();fail(e)});
