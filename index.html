.photo .placeholder small{display:block;max-width:100%;font-size:12px;line-height:1.25;white-space:normal;overflow-wrap:normal;word-break:normal;color:#777}
.recentrow .photo .placeholder{padding:3px;gap:3px}
.recentrow .photo .placeholder svg{width:19px;height:19px}

.brandlock{max-width:calc(100% - 45px);padding:0;flex-shrink:1}
.brandwords{font-size:clamp(17px,5vw,23px)}

.asset h3,.asset small{overflow-wrap:anywhere}

/* iOS: keep the layout inside the viewport, including intrinsic grid sizes. */

header,main,nav{width:100%;min-width:0}

.grid,.quick,.categorygrid,.catalog{min-width:0;max-width:100%}

.quick button{min-width:0;max-width:100%;overflow-wrap:anywhere}
.hero,.category{min-width:0;max-width:100%}
.hero i{flex-shrink:0}
nav{width:100%;left:0;right:0}

async function logoutLive(){await db.auth.signOut();me=null;records=[];refs={};active=null;go('login')}
function liveCard(a){return '<article class="card asset" onclick="liveDetail(\''+safeId(a.id)+'\')"><div class="photo"><span class="placeholder">'+ico('box')+'</span></div><h3>'+esc(a.name)+'</h3><small>'+esc(a.inventory_number)+' · '+esc(locationOf(a))+'</small><br><span class="badge warn">'+esc(cond(a.condition))+'</span></article>'}
function liveResults(){const q=query.toLowerCase();const cat=document.querySelector('#livecat')?.value,show=document.querySelector('#liveshow')?.value,wh=document.querySelector('#livewh')?.value;const a=records.filter(x=>([x.name,x.inventory_number,x.qr_code,x.material,x.color,...(x.tags||[])].join(' ').toLowerCase().includes(q))&&(!cat||x.category_id===cat)&&(!show||x.show_id===show)&&(!wh||x.warehouse_id===wh));document.querySelector('#livecount').textContent=a.length+' позицій';document.querySelector('#liveresults').innerHTML=a.map(liveCard).join('')||'<p>Немає майна за цими параметрами.</p>'}
function liveDetail(id){active=records.find(a=>a.id===id);if(active)go('detail')}
function liveForm(a){const f=(n,l,type='text')=>'<label>'+l+'<input name="'+n+'" type="'+type+'" '+(type==='number'?'min="0" step="any"':'')+' value="'+esc(a?.[n]??'')+'"></label>';form(a?'Редагування':'Нове майно',(a?'':f('inventory_number','Інвентарний номер (обов’язково)'))+f('name','Назва (обов’язково)')+f('description','Опис')+'<label>Категорія<select name="category_id">'+optionIds('categories',a?.category_id)+'</select></label>'+(a?'':'<label>Шоу<select name="show_id">'+optionIds('shows')+'</select></label><label>Склад<select name="warehouse_id" required>'+optionIds('warehouses',null,false)+'</select></label>')+f('color','Колір')+f('material','Матеріал')+f('width_cm','Ширина, см','number')+f('height_cm','Висота, см','number')+f('depth_cm','Глибина, см','number')+f('weight_kg','Вага, кг','number')+f('notes','Коментар'),async d=>{if(busy)return false;busy=true;try{const v=Object.fromEntries(d);if(!v.name.trim()||(!a&&!v.inventory_number.trim()))throw Error('Заповніть назву та номер');for(const k of ['width_cm','height_cm','depth_cm','weight_kg'])v[k]=v[k]===''?null:Number(v[k]);v.category_id=v.category_id||null;if(!a){v.show_id=v.show_id||null;v.original_show_id=v.show_id;const row=await take(db.from('assets').insert(v).select('id').single());await loadLive();active=records.find(x=>x.id===row.id)}else{await take(db.from('assets').update(v).eq('id',a.id).select('id').single());await loadLive();active=records.find(x=>x.id===a.id)}page='detail';toast('Збережено в базі')}catch(e){fail(e);return false}finally{busy=false}})}
async function liveFiles(id){try{const [photos,docs]=await Promise.all([take(db.from('asset_photos').select('id,storage_path,created_at').eq('asset_id',id).order('created_at',{ascending:false})),take(db.from('asset_documents').select('id,name,storage_path').eq('asset_id',id))]);if(active?.id!==id||page!=='detail')return;const el=document.querySelector('#livefiles');el.innerHTML='<h2>Фото</h2><div class="grid" id="livephotos"></div><h2>Документи</h2><div id="livedocs"></div>';if(createOK())el.insertAdjacentHTML('beforeend','<label>Додати фото<input type="file" accept="image/*" onchange="liveUpload(this,\'asset-photos\')"></label><label>Додати документ<input type="file" onchange="liveUpload(this,\'asset-documents\')"></label>');for(const p of photos){const u=await take(db.storage.from('asset-photos').createSignedUrl(p.storage_path,300));if(active?.id!==id||page!=='detail')return;document.querySelector('#livephotos').insertAdjacentHTML('beforeend','<div class="photo"><img src="'+esc(u.signedUrl)+'" alt="Фото реквізиту"></div>')}for(const d of docs){const u=await take(db.storage.from('asset-documents').createSignedUrl(d.storage_path,300));if(active?.id!==id||page!=='detail')return;document.querySelector('#livedocs').insertAdjacentHTML('beforeend','<p><a target="_blank" rel="noopener" href="'+esc(u.signedUrl)+'">'+esc(d.name)+'</a></p>')}}catch(e){fail(e)}}
async function liveUpload(input,bucket){const f=input.files[0],id=active?.id;if(!f||!id||busy)return;busy=true;input.disabled=true;try{const path=id+'/'+crypto.randomUUID();await take(db.storage.from(bucket).upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false}));const photo=bucket==='asset-photos';const row=photo?{asset_id:id,storage_path:path}:{asset_id:id,storage_path:path,name:f.name,file_size:f.size,mime_type:f.type};await take(db.from(photo?'asset_photos':'asset_documents').insert(row));toast('Файл збережено');await liveFiles(id)}catch(e){fail(e)}finally{busy=false;input.disabled=false;input.value=''}}
render=function(){document.body.dataset.page=page;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')==="go('"+page+"')"));if(!me){document.body.dataset.page='login';app.innerHTML='<section class="loginpage"><div class="loginbrand">'+mascotMarkup+'<strong>STAGE<br>BASE</strong><p>by Stage Show Company</p></div><form class="loginform" onsubmit="loginLive(event)"><h1>Вхід у систему</h1><div class="loginfield">'+ico('mail')+'<input name="email" type="email" placeholder="Email" autocomplete="username" required></div><div class="loginfield">'+ico('lock')+'<input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required></div><button class="primary" type="submit">Увійти</button><p class="demohint">Доступ лише для запрошених працівників.</p></form></section>';return}
if(page==='home'){app.innerHTML='<div class="greeting">Вітаємо,<h1>'+esc(me.full_name)+'</h1><small>'+esc(me.role.name)+'</small></div><button class="hero" onclick="go(\'shows\')"><span>Шоу<strong>'+refs.shows.length+'</strong></span></button><div class="grid">'+[['Усього майна',records.length],['На складах',records.filter(a=>a.location_type==='warehouse').length],['Не перевірено',records.filter(a=>a.condition==='unverified').length],['Пошкоджено',records.filter(a=>a.condition==='damaged').length]].map(([n,v])=>'<div class="card metric"><small>'+n+'</small><strong>'+v+'</strong></div>').join('')+'</div><button class="primary full" onclick="go(\'catalog\')">Каталог майна</button>'+(createOK()?'<button class="full" onclick="liveForm()">＋ Додати майно</button>':'');return}
if(page==='catalog'){app.innerHTML='<h1>Каталог майна</h1><input placeholder="Назва, номер, матеріал, тег" value="'+esc(query)+'" oninput="query=this.value;liveResults()"><select id="livecat" onchange="liveResults()">'+optionIds('categories')+'</select><select id="liveshow" onchange="liveResults()">'+optionIds('shows')+'</select><select id="livewh" onchange="liveResults()">'+optionIds('warehouses')+'</select>'+(createOK()?'<button class="primary full" onclick="liveForm()">＋ Додати майно</button>':'')+'<p id="livecount"></p><div id="liveresults" class="grid catalog"></div>';liveResults();return}
if(page==='detail'&&active){const a=active;app.innerHTML='<button class="back" onclick="go(\'catalog\')">← Каталог</button><h1>'+esc(a.name)+'</h1><small>'+esc(a.inventory_number)+'</small><div class="card">'+[['Категорія',nameOf('categories',a.category_id)],['Шоу',nameOf('shows',a.show_id)],['Місце',locationOf(a)],['Стан',cond(a.condition)],['Кількість',a.quantity+' '+a.unit],['Матеріал',a.material],['Колір',a.color],['Габарити, см',[a.width_cm,a.depth_cm,a.height_cm].join(' × ')],['QR-код',a.qr_code],['Опис',a.description],['Коментар',a.notes],['Дедлайн перевірки',a.inspection_due_at?new Date(a.inspection_due_at).toLocaleDateString('uk-UA'):'—']].map(([k,v])=>'<div class="line"><small>'+k+'</small><br><b>'+esc(v||'—')+'</b></div>').join('')+'</div>'+(editOK()?'<button class="primary full" onclick="liveForm(active)">Редагувати</button>':'')+'<div id="livefiles"></div>';liveFiles(a.id);return}
if(page==='shows'){app.innerHTML='<h1>Шоу та склади</h1>'+['shows','warehouses'].map(t=>'<h2>'+(t==='shows'?'Шоу':'Склади')+'</h2>'+refs[t].map(x=>'<div class="card line"><b>'+esc(x.name)+'</b><p>'+records.filter(a=>a[t==='shows'?'show_id':'warehouse_id']===x.id).length+' позицій</p></div>').join('')).join('');return}
if(page==='profile'){app.innerHTML='<h1>Профіль</h1><div class="card"><b>'+esc(me.full_name)+'</b><p>'+esc(me.role.name)+'</p><small>'+esc(me.email)+'</small></div><button class="full" onclick="logoutLive()">Вийти</button>';return}
if(page==='lookup'){app.innerHTML='<h1>Пошук за номером або QR</h1><input id="num" placeholder="Інвентарний номер або QR"><button class="primary full" onclick="let q=document.querySelector(\'#num\').value.trim().toLowerCase();let a=records.find(x=>[x.inventory_number,x.qr_code].some(y=>y.toLowerCase()===q));a?liveDetail(a.id):toast(\'Не знайдено\')">Знайти</button>';return}
app.innerHTML='<h1>Операції</h1><div class="notice">Бронювання, видача та приймання ще не підключені. Зміни в обліку через цей екран заблоковані.</div><button class="full" onclick="go(\'catalog\')">Каталог</button>'};
page='login';render();loadLive().then(()=>{if(me)go('home')}).catch(e=>{me=null;render();fail(e)});
</script></html>
