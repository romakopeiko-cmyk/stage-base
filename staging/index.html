<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Stage Base Staging</title>
<link rel="icon" href="../icons/stage-base.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2f8;color:#1b1420;font:16px system-ui,sans-serif}header{background:#27113f;color:white;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px}header div,main{max-width:720px;margin:auto}header div{display:flex;align-items:center;gap:12px}header img{width:40px;height:40px}main{padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}h1{font-size:24px;margin:8px 0 16px}label{display:block;margin:10px 0}input,select,button{font:inherit;border-radius:10px;padding:10px;max-width:100%}input:not([type=checkbox]),select{display:block;width:100%;border:1px solid #d7cfe0;margin-top:4px}button{background:#eee8f3;color:#27113f;border:0;cursor:pointer;min-height:44px}button.primary{background:#ffd600;color:#1b1420;font-weight:700}.full{display:block;width:100%;margin-top:8px}.card,dialog{background:#fff;border:0;border-radius:14px;padding:16px;margin-bottom:12px}.line{padding:10px 0;border-bottom:1px solid #eee}.line p{margin:5px 0}dialog{margin:auto;width:min(calc(100% - 24px),520px);max-height:calc(100dvh - 26px);overflow:auto}dialog::backdrop{background:#1b1420a0}summary{cursor:pointer}#notice{display:block;min-height:1.5em;margin:8px 0;overflow-wrap:anywhere}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.90.1/dist/umd/supabase.min.js"></script>
<script defer src="./app.js"></script>
<script defer src="./team-admin.js"></script>
</head>
<body>
<header><div><img src="../icons/stage-base.svg" alt=""><strong>Stage Base Staging</strong></div></header>
<main><div id="notice" role="status"></div><div id="app"></div></main>
<dialog id="modal"></dialog>
</body>
</html>
