  me = null; page='login'; document.body.dataset.page='login';
  const mascotMarkup="<svg class=\"mascot\" viewBox=\"0 0 64 70\" aria-hidden=\"true\"><path fill=\"#ffd600\" d=\"M12 49C-2 39 0 13 16 7c13-5 23 3 24 15 14-7 26 4 23 18-3 17-24 31-39 27-9-2-14-9-12-18Z\"/><g fill=\"#1a1a1a\"><circle cx=\"17\" cy=\"23\" r=\"2.8\"/><circle cx=\"26\" cy=\"22\" r=\"2.8\"/><circle cx=\"43\" cy=\"34\" r=\"2.8\"/><circle cx=\"52\" cy=\"34\" r=\"2.8\"/></g></svg>";
  app.innerHTML='<section class="loginpage"><div class="loginbrand">'+mascotMarkup+'<strong>STAGE<br>BASE</strong><p>by Stage Show Company</p><p>STAGING · Тестова версія</p></div><form class="loginform"><h1>Вхід у систему</h1><div class="loginfield"><input name="email" type="email" placeholder="Email" autocomplete="username" required></div><div class="loginfield"><input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required></div><button class="primary" type="submit">Увійти</button><p class="demohint">Доступ лише для запрошених працівників.</p></form></section>';
  app.querySelector('form').onsubmit = async event => {
    event.preventDefault();
    const data = new FormData(event.target);
    event.submitter.disabled = true;
    try {
      const { session } = await take(db.auth.signInWithPassword({ email: data.get('email'), password: data.get('password') }));
      await openSession(session);
    } catch (error) { fail(error); }
    finally { event.submitter.disabled = false; }
  };
}

function editPassword(firstLogin = false) {
  form(firstLogin ? 'Встановіть пароль для наступних входів' : 'Змінити пароль',
    '<label>Новий пароль<input type="password" name="password" autocomplete="new-password" minlength="12" required></label>',
    async fields => {
      await take(db.auth.updateUser({ password: fields.get('password') }));
      toast('Пароль збережено. Ви можете входити за email і паролем.');
      return true;
    }, 'Встановити пароль');
}

async function openSession(session) {
  const accepted = await take(db.rpc('stage_claim_team_invitation'));
  const active = await take(db.rpc('stage_member_active'));
  if (!active) {
    await db.auth.signOut({ scope: 'local' });
    login();
    toast('Доступ не активовано. Запрошення могло бути відкликане або прострочене. Попросіть адміністратора перевірити його стан.');
    return;
  }
  me = await take(db.from('profiles').select('id,full_name,job_title').eq('id', session.user.id).single());
  me.email=session.user.email;
  const checks = { tasks: 'tasks.read', catalog: 'assets.read', shows: 'shows.read', warehouses: 'warehouses.read' };
  me.access = Object.fromEntries(await Promise.all(Object.entries(checks).map(async ([section, feature]) =>
    [section, await take(db.rpc('stage_within_limits', { p_feature: feature, p_show: null, p_warehouse: null })) === true])));

  toast('');
  go('profile');
  if (accepted) editPassword(true);
}

document.addEventListener('DOMContentLoaded', async () => {
  try {
    if (callback.has('error') || callback.has('error_code')) {
      history.replaceState(null, '', location.pathname + location.search);
      login();
      toast('Посилання недійсне або прострочене. Попросіть адміністратора надіслати запрошення повторно.');
      return;
    }
    if (callback.has('token_hash')) {
      history.replaceState(null, '', location.pathname + location.search);
      try {
        const { session } = await take(db.auth.verifyOtp({ token_hash: callback.get('token_hash'), type: 'invite' }));
        callback.delete('token_hash');
        await openSession(session);
      } catch {
        login();
        toast('Не вдалося прийняти запрошення. Воно могло бути використане або прострочене.');
      }
      return;
    }
    const { session } = await take(db.auth.getSession());
    if (session) await openSession(session);
    else login();
  } catch (error) { login(); fail(error); }
});
